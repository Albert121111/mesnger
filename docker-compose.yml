services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mesnger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mesnger
      JWT_ACCESS_SECRET: access_secret_change
      JWT_REFRESH_SECRET: refresh_secret_change
      FRONTEND_URL: http://localhost:3000
      BACKEND_PORT: 4000
    depends_on: [postgres]
    ports: ["4000:4000"]
    volumes: ["./backend/uploads:/app/backend/uploads"]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  pgdata:
