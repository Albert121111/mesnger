services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mesnger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mesnger"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mesnger
      JWT_ACCESS_SECRET: access_secret_change
      JWT_REFRESH_SECRET: refresh_secret_change
      FRONTEND_URL: http://localhost:3000
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 4000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      UPLOAD_DIR: uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["4000:4000"]
    volumes: ["./backend/uploads:/app/backend/uploads"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      backend:
        condition: service_healthy
    ports: ["3000:3000"]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
